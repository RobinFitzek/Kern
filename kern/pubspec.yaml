name: kern
description: "Kern — Android health coaching app with Garmin support via Health Connect."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State management — plugins as Riverpod Providers
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database — Raw Store + Derived Store (SQLite via Drift ORM)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.0

  # Health Connect integration
  health: ^11.0.0

  # AI coach (Gemini)
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  dynamic_color: ^1.8.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

  # Riverpod code generation
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#1A73E8"

flutter:
  uses-material-design: true
  assets:
    - assets/
